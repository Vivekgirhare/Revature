<!-- 10. Closures – Secure Counter

Create a counter function that cannot be directly modified from outside. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
function counter(){
  let count = 0;
  return function(){
    count++;
    return count;
  }
}

let c = counter();

document.write(c() + "<br>");
document.write(c());
</script>
    
</body>
</html>
