<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Page</title>
    <link rel="stylesheet" href="Productpage.css">
</head>

<body>
<div class="layout">

    <!-- Sticky Navbar -->
    <header class="header">
        <h2>My Store</h2>
    </header>

    <!-- Sidebar -->
    <aside class="sidebar">
        <h3>Filters</h3>
        <p>Category</p>
        <p>Price</p>
        <p>Brands</p>
    </aside>

    <!-- Main Content -->
    <main class="content">

        <h2>Products</h2>

        <div class="products">
            <div class="card">
                <img src="p1.jpg">
                <h4>Product 1</h4>
                <p>$199</p>
                <button>Add to Cart</button>
            </div>

            <div class="card">
                <img src="p2.jpg">
                <h4>Product 2</h4>
                <p>$299</p>
                <button>Add to Cart</button>
            </div>

            <div class="card">
                <img src="p3.jpg">
                <h4>Product 3</h4>
                <p>$399</p>
                <button>Add to Cart</button>
            </div>

            <div class="card">
                <img src="p4.jpg">
                <h4>Product 4</h4>
                <p>$499</p>
                <button>Add to Cart</button>
            </div>
        </div>

    </main>

    <footer class="footer">
        © 2025 My Store
    </footer>

</div>

<!-- Fixed Cart Icon -->
<div class="cart">
🛒
</div>

</body>
</html>
