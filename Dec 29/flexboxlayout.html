<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Layout Example </title>
</head>

    <head>
    <style>
        .container{
            display: flex;
            flex-wrap: wrap;
        }
        .h1{
            font-size: clamp(1.5rem, 5vw, 3rem);
        }
        .box{
            flex: 1 1 300px;
            /* background: rgb(162, 155, 155); */
        }
        .grid{
            flex: 2 1 300px;

        }
        @media(max-width:768px){
            .sidebar{
                display: none;

        }
        @container(min-width-400px){
            .card-container{
                container-type: inline-size;
                border: 2px solid blue;
                padding: 10px;
                margin: 10px;
                background-color: lightcoral;
            }

        }
    
    }
    </style>

    </head>
        <body>
            <div class="container">
                <h1>Lorem ipsum dolor sit.</h1>
                <p>Flexbox layout Example</p>

                <div class="card-container">
                    <h2>Card Container</h2>
                </div>


                <div class="grid">
                    <p>Grid Box</p>
                    
                </div>
                <div class="sidebar">

                </div>
                
            </div>
        </body>
    
    

</html>
