<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <title>Bootstrap 5 Example</title>

   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

   <style>
      .box{
         border:1px solid #000;
         padding:15px;
         text-align:center;
         color: white;
      }
   </style>
</head>

<body>
   <h1 class="text-center mt-4">12 Columns and 2 Rows</h1>

   <div class="container mt-4">

      <!-- Row 1 -->
      <div class="row">
         <div class="col-1 box bg-primary">1</div>
         <div class="col-1 box bg-success">2</div>
         <div class="col-1 box bg-danger">3</div>
         <div class="col-1 box bg-warning text-dark">4</div>
         <div class="col-1 box bg-info text-dark">5</div>
         <div class="col-1 box bg-secondary">6</div>
         <div class="col-1 box bg-dark">7</div>
         <div class="col-1 box bg-primary">8</div>
         <div class="col-1 box bg-success">9</div>
         <div class="col-1 box bg-danger">10</div>
         <div class="col-1 box bg-warning text-dark">11</div>
         <div class="col-1 box bg-info text-dark">12</div>
      </div>

      <!-- Row 2 -->
      <div class="row mt-3">
         <div class="col-1 box bg-primary">1</div>
         <div class="col-1 box bg-success">2</div>
         <div class="col-1 box bg-danger">3</div>
         <div class="col-1 box bg-warning text-dark">4</div>
         <div class="col-1 box bg-info text-dark">5</div>
         <div class="col-1 box bg-secondary">6</div>
         <div class="col-1 box bg-dark">7</div>
         <div class="col-1 box bg-primary">8</div>
         <div class="col-1 box bg-success">9</div>
         <div class="col-1 box bg-danger">10</div>
         <div class="col-1 box bg-warning text-dark">11</div>
         <div class="col-1 box bg-info text-dark">12</div>
      </div>

      <h1 class="text-center mt-4">4 Columns and 3 Rows</h1>

      <!-- Row 1 -->
      <div class="row">
         <div class="col-3 box bg-primary">1</div>
         <div class="col-3 box bg-success">2</div>
         <div class="col-3 box bg-danger">3</div>
         <div class="col-3 box bg-warning text-dark">4</div>
      </div>

      <!-- Row 2 -->
      <div class="row mt-3">
         <div class="col-3 box bg-info text-dark">5</div>
         <div class="col-3 box bg-secondary">6</div>
         <div class="col-3 box bg-dark">7</div>
         <div class="col-3 box bg-primary">8</div>
      </div>

      <!-- Row 3 -->
      <div class="row mt-3">
         <div class="col-3 box bg-success">9</div>
         <div class="col-3 box bg-danger">10</div>
         <div class="col-3 box bg-warning text-dark">11</div>
         <div class="col-3 box bg-info text-dark">12</div>
      </div>

   </div>

   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
