  <style>

       width: 120px;

       border-radius: 10px;

            Hi, I am Vivek <br>

            I enjoy learning, experimenting and improving myself every day.
          </p>
        </div>
      </div>

      <!-- Profile Image Right Side -->
      <div class="col-md-4 text-center mt-4 mt-md-0">
        <img src="Profile picture.jpeg" alt="My Profile" class="profile-pic">
        <h4 class="mt-3">Vivek Girhare</h4>
      </div>

  </div>
